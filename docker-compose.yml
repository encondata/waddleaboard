# Waddle Aboard stack. install.sh writes .env next to this file and runs it; by hand:
#   docker compose up -d --build
# Relative paths below resolve against the repository root.
name: waddleaboard

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waddleaboard}
      POSTGRES_USER: ${POSTGRES_USER:-waddle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ${WADDLE_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  spaces:
    build:
      context: deploy
      dockerfile: minio.Dockerfile
      args:
        MINIO_RELEASE: ${MINIO_RELEASE:-RELEASE.2025-10-15T17-29-55Z}
    image: waddleaboard-spaces:${MINIO_RELEASE:-RELEASE.2025-10-15T17-29-55Z}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-waddle}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - ${WADDLE_DATA_DIR:-./data}/minio:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    image: waddleaboard-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      spaces:
        condition: service_healthy
    environment:
      PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-waddleaboard}
      POSTGRES_USER: ${POSTGRES_USER:-waddle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: spaces
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-waddle}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-waddleaboard-photos}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      PHOTO_MAX_BYTES: ${PHOTO_MAX_BYTES:-8388608}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      SEED_DEMO: ${SEED_DEMO:-0}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: waddleaboard-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      WEB_MAX_BODY_SIZE: ${WEB_MAX_BODY_SIZE:-12m}
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8430}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
